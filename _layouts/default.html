<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/yeezy.css' | relative_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a href="{{ '/' | relative_url }}" class="brand-stamp">
      <span class="brand-num">001.</span>
      <span class="brand-name">SSL</span>
      <span class="brand-meta">Soul Specification Language · v6.0</span>
    </a>
    <nav class="masthead-nav">
      <a href="{{ '/docs/v6/' | relative_url }}" class="eyebrow-link">v6 spec</a>
      <a href="{{ '/docs/' | relative_url }}" class="eyebrow-link">v5 historical</a>
      <a href="{{ '/examples/' | relative_url }}" class="eyebrow-link">examples</a>
      <a href="{{ '/ref/' | relative_url }}" class="eyebrow-link">reference impl</a>
      <a href="https://github.com/Galmanus/ssl-spec" target="_blank" rel="noopener" class="eyebrow-link">github</a>
    </nav>
  </div>
</header>

<main class="content">
  <article class="prose">
    {{ content }}
  </article>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-stamp">
      <span class="footer-num">001.</span>
      <span class="footer-name">SSL</span>
    </div>
    <div class="footer-meta">
      <p>Soul Specification Language · v6.0 · CC BY 4.0 (spec) · MIT (reference)</p>
      <p>Forged at <a href="https://bluewaveai.online" target="_blank" rel="noopener">Bluewave AI</a> · ratified 2026-05-09</p>
      <p>Built by <a href="https://br.linkedin.com/in/galmanus" target="_blank" rel="noopener">Manuel Guilherme Galmanus</a> · CNPJ 66.381.800/0001-08</p>
    </div>
  </div>
</footer>

</body>
</html>
